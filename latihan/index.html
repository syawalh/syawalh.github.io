.fg-pants, .fg-pa { stroke: var(--fig-pants); } .fg-pa2 { stroke: var(--fig-pants2); }
.fg-shoe { fill: var(--fig-shoe); stroke: var(--fig-sole); stroke-width: 0.9; stroke-linejoin: round; }
.fg-shoe2 { fill: var(--fig-shoe2); stroke: var(--fig-sole); stroke-width: 0.9; stroke-linejoin: round; }
.fg-hair { fill: var(--fig-hair); } .fg-eye { fill: var(--fig-hair); }
.w-ua { stroke-width: 7.2; } .w-fa { stroke-width: 6.1; } .w-sl { stroke-width: 8.4; } .w-th { stroke-width: 10.8; } .w-pa { stroke-width: 11.9; }
.w-sh { stroke-width: 8.6; } .w-to { stroke-width: 15; } .w-pt { stroke-width: 15.6; } .w-ne { stroke-width: 5.2; }
.fg-pack { fill: var(--fig-pack); } .fg-pack2 { fill: var(--fig-pack2); }
.fg-band { stroke: var(--fig-band); stroke-width: 2.2; fill: none; stroke-linecap: round; }
.fg-towel { stroke: var(--fig-towel); stroke-width: 2.4; fill: none; stroke-linecap: round; }
.pr-floor { fill: var(--pr-floor); } .pr-mat { fill: var(--pr-mat); }
.pr-wall { fill: var(--pr-wall); } .pr-wood rect, .pr-wood { fill: var(--pr-wood); } .pr-wood2 { fill: var(--pr-wood2); }
.pr-sofa rect { fill: var(--pr-sofa); } .pr-sofa2 { fill: var(--pr-sofa2); }
.pr-book rect { fill: var(--pr-book); } .pr-book .pr-book2 { fill: var(--pr-book2); }
.pr-cush { fill: var(--pr-cush); } .pr-door { fill: var(--pr-door); } .pr-bar { stroke: var(--pr-bar); stroke-width: 2.6; stroke-linecap: round; }
.pr-bar2 { fill: var(--pr-bar); } .pr-towel { fill: var(--fig-towel); }
.pr-plant path { fill: var(--pr-leaf); } .pr-pot { fill: var(--pr-pot); } .pr-bottle { fill: var(--pr-bottle); } .pr-bottle2 { fill: var(--pr-bottle2); }

/* Workout Rumahan v2 — tampilan mengikuti mockup: biru muda, kartu putih, teks navy, tombol biru, aksen teal & kuning.
   Tata letak: satu kolom HP (maks 480px), tab bawah tetap, halaman detail menumpuk di atas tab. */
:root {
  --bg: #EAF3FC; --bg2: #F4F9FE; --card: #FFFFFF; --card2: #F7FAFE;
  --ink: #1D3A5F; --ink2: #566C8A; --ink3: #8496AF; --line: #DAE6F3; --line2: #C9D9EC;
  --primary: #2F7FDB; --primary2: #2268BC; --on-primary: #FFFFFF; --primary-soft: #E2EEFC;
  --teal: #19A693; --teal-soft: #DCF2EE; --sun: #E99A22; --sun-soft: #FDEFD7; --danger: #D04A46; --danger-soft: #FBE6E5; --ok: #2A9A62; --ok-soft: #DFF3E8;
  --scene: #DCEBFA; --scene2: #EFF6FD;
  --shadow: 0 1px 2px rgba(29, 58, 95, .05), 0 6px 20px rgba(29, 58, 95, .07);
  --shadow-up: 0 -4px 18px rgba(29, 58, 95, .06);
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Baloo 2", "Poppins", system-ui, sans-serif;
  --r: 18px; --r-sm: 12px;
  --fig-skin: #E2A87F; --fig-skin2: #C98F66; --fig-shirt: #3C85DC; --fig-shirt2: #2C69B5; --fig-pants: #26344C; --fig-pants2: #1B2537;
  --fig-shoe: #F4F7FB; --fig-shoe2: #D9E1EC; --fig-sole: #93A4BA; --fig-hair: #2A211B; --fig-pack: #F08A5D; --fig-pack2: #D96C40; --fig-band: #E25B8F; --fig-towel: #F2C14E;
  --pr-floor: #CFE0F2; --pr-mat: #9CC3EE; --pr-wall: #E4EDF7; --pr-wood: #C19A6B; --pr-wood2: #A67C52; --pr-sofa: #8DB3E2; --pr-sofa2: #6F96C8;
  --pr-book: #7BB8A8; --pr-book2: #F7E2B5; --pr-cush: #F5C9A5; --pr-door: #B9C7D8; --pr-bar: #55657A; --pr-leaf: #4FA36B; --pr-pot: #D98E5F; --pr-bottle: #5EB1E8; --pr-bottle2: #2F7FDB;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1A2B; --bg2: #12223A; --card: #172A43; --card2: #1B304C;
    --ink: #E6EEF8; --ink2: #A8B9CF; --ink3: #7C90AC; --line: #243C5C; --line2: #2F4B70;
    --primary: #5AA2F4; --primary2: #7DB6F7; --on-primary: #0B1628; --primary-soft: #1C3556;
    --teal: #3ECBB5; --teal-soft: #173B3C; --sun: #F5B24E; --sun-soft: #3A2E17; --danger: #F07672; --danger-soft: #3E2024; --ok: #4CC488; --ok-soft: #173A2B;
    --scene: #1C3352; --scene2: #172B45;
    --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 6px 20px rgba(0, 0, 0, .25); --shadow-up: 0 -4px 18px rgba(0, 0, 0, .3);
    --fig-shirt: #4A92E6; --fig-shirt2: #3574C4; --fig-pants: #3A4F72; --fig-pants2: #2D3F5E; --fig-shoe: #E8EEF6; --fig-shoe2: #C4D0DF;
    --pr-floor: #29466B; --pr-mat: #3C6BA3; --pr-wall: #213A5A; --pr-wood: #9C7A55; --pr-wood2: #806140; --pr-sofa: #4E77AD; --pr-sofa2: #3E6293;
    --pr-book: #4D8C7C; --pr-book2: #C9B48A; --pr-cush: #B98E6E; --pr-door: #3D5878; --pr-bar: #9AAAC0; --pr-leaf: #3E8E5A; --pr-pot: #B87449; --pr-bottle: #4B9BD6; --pr-bottle2: #2F7FDB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1A2B; --bg2: #12223A; --card: #172A43; --card2: #1B304C;
  --ink: #E6EEF8; --ink2: #A8B9CF; --ink3: #7C90AC; --line: #243C5C; --line2: #2F4B70;
  --primary: #5AA2F4; --primary2: #7DB6F7; --on-primary: #0B1628; --primary-soft: #1C3556;
  --teal: #3ECBB5; --teal-soft: #173B3C; --sun: #F5B24E; --sun-soft: #3A2E17; --danger: #F07672; --danger-soft: #3E2024; --ok: #4CC488; --ok-soft: #173A2B;
  --scene: #1C3352; --scene2: #172B45;
  --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 6px 20px rgba(0, 0, 0, .25); --shadow-up: 0 -4px 18px rgba(0, 0, 0, .3);
  --fig-shirt: #4A92E6; --fig-shirt2: #3574C4; --fig-pants: #3A4F72; --fig-pants2: #2D3F5E; --fig-shoe: #E8EEF6; --fig-shoe2: #C4D0DF;
  --pr-floor: #29466B; --pr-mat: #3C6BA3; --pr-wall: #213A5A; --pr-wood: #9C7A55; --pr-wood2: #806140; --pr-sofa: #4E77AD; --pr-sofa2: #3E6293;
  --pr-book: #4D8C7C; --pr-book2: #C9B48A; --pr-cush: #B98E6E; --pr-door: #3D5878; --pr-bar: #9AAAC0; --pr-leaf: #3E8E5A; --pr-pot: #B87449; --pr-bottle: #4B9BD6; --pr-bottle2: #2F7FDB;
  color-scheme: dark;
}

html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--primary); }
:focus-visible { outline: 2.5px solid var(--primary); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 18px; height: 18px; } .ico.xs { width: 15px; height: 15px; stroke-width: 2.2; } .ico.lg { width: 26px; height: 26px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink2); } .faint { color: var(--ink3); }
.small { font-size: 12.5px; line-height: 1.5; } .tiny { font-size: 11px; line-height: 1.4; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); }
.stack { display: grid; gap: 12px; } .stack.lg { gap: 18px; } .stack.sm { gap: 8px; } .stack.xs { gap: 4px; }
.row-flex { display: flex; align-items: center; gap: 10px; min-width: 0; } .row-flex.between { justify-content: space-between; } .row-flex.wrap { flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.center { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Kerangka aplikasi ---------- */
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
.scr { padding: 10px 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
.page.has-foot .scr { padding-bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--card); box-shadow: var(--shadow-up); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { border: 0; background: none; min-height: 62px; padding: 9px 4px 8px; display: grid; justify-items: center; gap: 2px; font-size: 11.5px; font-weight: 500; color: var(--ink3); }
.tab .ico { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: var(--primary); font-weight: 600; }
.page { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); }
.page > .app { min-height: 100%; }
.page.enter { animation: pageIn .22s ease-out; }
@keyframes pageIn { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.topbar { display: flex; align-items: center; gap: 6px; min-height: 52px; position: sticky; top: 0; z-index: 3; background: var(--bg); margin: 0 -16px; padding: 4px 10px 4px 6px; }
.topbar h1 { font-size: 19px; font-weight: 700; line-height: 1.25; }
.topbar .sub { font-size: 12.5px; color: var(--ink2); }
.iconbtn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; color: var(--ink); flex: none; }
.iconbtn:active { background: var(--primary-soft); }
.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: linear-gradient(to top, var(--bg) 70%, transparent); padding: 18px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.foot .in { max-width: 448px; margin: 0 auto; display: grid; gap: 6px; }
.page .foot { bottom: calc(62px + env(safe-area-inset-bottom, 0px)); padding-bottom: 12px; }
.page .foot.wizfoot { bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }

/* ---------- Komponen dasar ---------- */
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.card.tight { padding: 12px 14px; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sec-title h2 { font-size: 16px; font-weight: 700; }
.sec-title .link { font-size: 13px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--primary); color: var(--on-primary); font-weight: 600; font-size: 15px; text-decoration: none; transition: transform .1s, background .15s; }
.btn:active { transform: scale(.98); background: var(--primary2); }
.btn.block { width: 100%; }
.btn.soft { background: var(--primary-soft); color: var(--primary); }
.btn.line { background: transparent; color: var(--primary); box-shadow: inset 0 0 0 1.5px var(--line2); }
.btn.teal { background: var(--teal); color: #fff; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.sm { min-height: 38px; padding: 0 16px; font-size: 13.5px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link { border: 0; background: none; color: var(--primary); font-weight: 600; padding: 10px 6px; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; justify-content: center; }
.link.block { width: 100%; }
.link.danger { color: var(--danger); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--primary-soft); color: var(--primary); white-space: nowrap; }
.pill.teal { background: var(--teal-soft); color: var(--teal); } .pill.sun { background: var(--sun-soft); color: var(--sun); } .pill.danger { background: var(--danger-soft); color: var(--danger); } .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.grey { background: var(--bg2); color: var(--ink2); }
.ib { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; flex: none; background: var(--primary-soft); color: var(--primary); }
.ib.teal { background: var(--teal-soft); color: var(--teal); } .ib.sun { background: var(--sun-soft); color: var(--sun); } .ib.danger { background: var(--danger-soft); color: var(--danger); } .ib.ok { background: var(--ok-soft); color: var(--ok); }
.ib.round { border-radius: 50%; }
.ib.sm { width: 34px; height: 34px; border-radius: 10px; }
.list { display: grid; gap: 10px; }
.lrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 12px 12px 14px; border: 0; width: 100%; text-align: left; color: var(--ink); text-decoration: none; }
.lrow .t { font-weight: 600; font-size: 14px; line-height: 1.35; }
.lrow .d { font-size: 12.5px; color: var(--ink2); line-height: 1.45; }
.lrow .chev { color: var(--ink3); }
.lrow.plain { box-shadow: none; background: transparent; padding-left: 2px; padding-right: 2px; }
.group { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.group .lrow { box-shadow: none; border-radius: 0; background: transparent; }
.group .lrow + .lrow { border-top: 1px solid var(--line); }
.checks { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.checks li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; }
.checks li .ico { color: var(--teal); margin-top: 2px; }
.steps-ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: s; }
.steps-ol li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; counter-increment: s; }
.steps-ol li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.note { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--bg2); border-radius: 14px; padding: 12px 14px; font-size: 13px; color: var(--ink2); }
.note .ico { color: var(--primary); margin-top: 1px; }
.note.warn { background: var(--sun-soft); color: var(--ink); } .note.warn .ico { color: var(--sun); }
.note.stop { background: var(--danger-soft); color: var(--ink); } .note.stop .ico { color: var(--danger); }
.note.ok { background: var(--ok-soft); color: var(--ink); } .note.ok .ico { color: var(--ok); }
.divider { height: 1px; background: var(--line); margin: 2px 0; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; font-size: 13.5px; }
.kv dt { color: var(--ink2); } .kv dd { margin: 0; font-weight: 600; text-align: right; }
.prog { height: 8px; border-radius: 99px; background: var(--primary-soft); overflow: hidden; }
.prog > i { display: block; height: 100%; border-radius: 99px; background: var(--primary); transition: width .3s; }
.prog.teal > i { background: var(--teal); } .prog.teal { background: var(--teal-soft); }
.prog.sun > i { background: var(--sun); } .prog.sun { background: var(--sun-soft); }

/* ---------- Ilustrasi (figur) ---------- */
.scene { background: linear-gradient(160deg, var(--scene), var(--scene2)); border-radius: var(--r); overflow: hidden; position: relative; }
.fig { display: block; width: 100%; height: auto; overflow: hidden; }
.thumb { width: 64px; height: 52px; border-radius: 12px; background: linear-gradient(160deg, var(--scene), var(--scene2)); overflow: hidden; flex: none; display: grid; place-items: center; }
.thumb .fig { width: 100%; height: 100%; }

/* ---------- Beranda ---------- */
.brand { display: flex; align-items: center; gap: 10px; padding-top: 8px; }
.brand .logo { width: 38px; height: 38px; color: var(--primary); flex: none; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: clamp(21px, 6.2vw, 25px); line-height: 1.05; letter-spacing: -.01em; }
.brand p { font-size: 12.5px; color: var(--ink2); }
.hello { font-size: 13.5px; color: var(--ink2); }
.today { position: relative; border-radius: 22px; overflow: hidden; background: linear-gradient(150deg, var(--scene), var(--scene2)); box-shadow: var(--shadow); }
.today .art { position: absolute; right: -6px; bottom: 0; width: 62%; }
.today .body { position: relative; padding: 16px 16px 16px; display: grid; gap: 10px; }
.today .kicker { font-size: 13px; font-weight: 600; color: var(--ink); }
.today .inner { background: var(--card); border-radius: 16px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; max-width: 72%; box-shadow: 0 2px 8px rgba(29, 58, 95, .06); border: 0; text-align: left; color: var(--ink); }
.today .inner b { font-size: 15px; display: block; line-height: 1.3; }
.today .inner span { font-size: 12.5px; color: var(--ink2); }
.today .cta { justify-self: start; margin-top: 4px; }
.today .done { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ok); }
.today.rest { background: linear-gradient(150deg, var(--teal-soft), var(--scene2)); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 10px; display: grid; gap: 6px; justify-items: center; text-align: center; border: 0; color: var(--ink); min-width: 0; }
.tile .ib { width: 38px; height: 38px; }
.tile b { font-size: 12.5px; line-height: 1.25; }
.tile span { font-size: 11px; color: var(--ink2); line-height: 1.35; }
.weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.wd { border: 0; background: none; padding: 2px 0; display: grid; justify-items: center; gap: 5px; color: var(--ink2); font-size: 11.5px; }
.wd .c { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line2); display: grid; place-items: center; color: var(--ink3); position: relative; }
.wd.today { color: var(--ink); font-weight: 700; }
.wd.today .c { border: 3.5px solid var(--teal); }
.wd.done .c { background: var(--teal); border-color: var(--teal); color: #fff; }
.wd.rest .c { border-style: dashed; }
.wd.miss .c { border-color: var(--line2); background: var(--bg2); }
.wd .k { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
.wd .k.kardio { background: var(--teal); } .wd .k.tes { background: var(--sun); } .wd .k.none { background: transparent; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--ink2); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--primary); }
.legend i.kardio { background: var(--teal); } .legend i.tes { background: var(--sun); }
.coach { display: grid; gap: 10px; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; position: relative; overflow: hidden; }
.coach::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--primary); }
.coach.warn::before { background: var(--sun); } .coach.stop::before { background: var(--danger); } .coach.ok::before { background: var(--teal); }
.coach .who { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--primary); letter-spacing: .02em; }
.coach h3 { font-size: 15px; font-weight: 700; line-height: 1.35; }
.coach p { font-size: 13px; color: var(--ink2); }
.coach .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.phase { display: grid; gap: 8px; }
.phase .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
.phase .top b { font-size: 14px; }

/* ---------- Detail sesi ---------- */
.hero-card { border-radius: 22px; overflow: hidden; background: linear-gradient(150deg, var(--scene), var(--scene2)); box-shadow: var(--shadow); display: grid; grid-template-columns: minmax(0, 1fr) 46%; align-items: end; min-height: 168px; }
.hero-card .txt { padding: 18px 0 18px 18px; display: grid; gap: 6px; align-content: center; height: 100%; }
